[package]
name = "unpack-buffered"
version = "0.1.0"
edition = "2021"
description = "Orthros archive/codec decompression for game ingestion (7z/deflate/LZMA1) → wasm"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.123"
js-sys = "0.3"
# default features OFF: drops aes256 (getrandom), bzip2, ppmd, compress(encoder),
# and the optional nt-time/filetime — none needed for LZMA/LZMA2/BCJ/Copy/Delta
# decode, and several pull non-wasm32 deps. Base decode covers our archives.
sevenz-rust2 = { version = "0.20", default-features = false }
miniz_oxide = "0.8"
lzma-rs = "0.3"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
