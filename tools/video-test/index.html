<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orthros Video Decoder Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: monospace;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-height: 100vh;
  }
  h1 { font-size: 1.1rem; color: #adf; }
  #drop-zone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 24px 40px;
    text-align: center;
    cursor: pointer;
    width: 100%;
    max-width: 640px;
    transition: border-color 0.2s, background 0.2s;
  }
  #drop-zone.drag-over { border-color: #7af; background: #1a2a3a; }
  #drop-zone input { display: none; }
  canvas {
    border: 1px solid #333;
    max-width: 100%;
    background: #000;
  }
  #info {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
    width: 100%;
    max-width: 640px;
  }
  .stat {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.82rem;
  }
  .stat .label { color: #888; font-size: 0.75rem; }
  .stat .value { color: #adf; font-weight: bold; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #2a2a2a;
    border: 1px solid #555;
    color: #eee;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
  }
  button:hover { background: #3a3a3a; }
  button:disabled { opacity: 0.4; cursor: default; }
  #log {
    width: 100%;
    max-width: 640px;
    height: 140px;
    overflow-y: auto;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 8px;
    font-size: 0.78rem;
    color: #8c8;
  }
  #log .err { color: #f88; }
  #log .warn { color: #fa8; }
  progress {
    width: 100%;
    max-width: 640px;
    height: 6px;
    appearance: none;
    border: none;
  }
  progress::-webkit-progress-bar { background: #222; border-radius: 3px; }
  progress::-webkit-progress-value { background: #4af; border-radius: 3px; }
</style>
</head>
<body>
<h1>Orthros Video Decoder Test — Bink (.bik) + Smacker (.smk)</h1>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  <input type="file" id="file-input" accept=".bik,.smk,.BIK,.SMK">
  <div>Drop a <strong>.bik</strong> or <strong>.smk</strong> file here, or click to browse</div>
  <div style="color:#666;font-size:0.8rem;margin-top:6px">video-decoder.wasm must be served from /video-decoder.wasm</div>
</div>

<canvas id="canvas" width="640" height="360"></canvas>
<progress id="progress" value="0" max="1"></progress>

<div id="info">
  <div class="stat"><div class="label">File</div><div class="value" id="stat-file">—</div></div>
  <div class="stat"><div class="label">Resolution</div><div class="value" id="stat-res">—</div></div>
  <div class="stat"><div class="label">Frame</div><div class="value" id="stat-frame">—</div></div>
  <div class="stat"><div class="label">FPS (source)</div><div class="value" id="stat-fps">—</div></div>
  <div class="stat"><div class="label">Render FPS</div><div class="value" id="stat-rfps">—</div></div>
  <div class="stat"><div class="label">Audio</div><div class="value" id="stat-audio">—</div></div>
</div>

<div id="controls">
  <button id="btn-play"  disabled>▶ Play</button>
  <button id="btn-pause" disabled>⏸ Pause</button>
  <button id="btn-stop"  disabled>⏹ Stop</button>
  <button id="btn-mute"  disabled>🔇 Mute</button>
</div>

<div id="log"></div>

<script type="module" src="main.ts"></script>
</body>
</html>
