<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#080c17"><title>Orthros</title><link rel="icon" type="image/png" href="/src/host/web/orthros_logo.png"><link rel="stylesheet" href="/src/ports/goldsrc/style.css"><link rel="stylesheet" href="/src/host/web/player.css"></head>
<body>
<div id="stage"><canvas id="canvas" width="1024" height="768" tabindex="0"></canvas></div>
<div id="topbar">
  <div class="brand"><img src="/src/host/web/orthros_logo.png" alt=""><span class="name">Orthros</span><span class="sep"></span><span class="game" id="tbGame"></span></div>
  <div class="spacer"></div>
  <div class="perf" id="tbPerf"><span class="fps">–</span><span class="unit">fps</span><canvas width="96" height="24"></canvas><span class="sub"></span></div>
  <button id="tbLobby" type="button" class="hidden"></button>
  <button id="tbFull" type="button"></button>
  <button id="tbGames" class="quiet" type="button"></button>
</div>
<div id="loader"><div class="bg"></div><div class="box">
  <div class="head"><img src="/src/host/web/orthros_logo.png" alt=""><div><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div></div>
  <form id="start"><label><span id="nameLabel"></span><input id="name" maxlength="24" required autocomplete="nickname"></label><button class="primary" id="launch" disabled></button></form>
  <div class="bar progress hidden"><div class="fill"></div></div>
  <div class="row"><span class="phase" id="status" role="status"></span><span class="pct progress hidden">0%</span></div>
  <div class="progress hidden">
    <ul><li data-k="engine"><span class="ic"></span><span></span><span class="v"></span></li><li data-k="files"><span class="ic"></span><span></span><span class="v"></span></li><li data-k="game"><span class="ic"></span><span></span><span class="v"></span></li></ul>
  </div>
  <div class="tip" id="tip"></div>
  <details><summary id="logLabel"></summary><pre id="log"></pre></details>
</div></div>
<div id="lobbyOverlay" class="hidden"><div class="panel"><button type="button" class="close" aria-label="close">✕</button></div></div>
<div id="toast" class="hidden"></div>
<script type="module" src="/src/ports/goldsrc/play.js"></script></body></html>
