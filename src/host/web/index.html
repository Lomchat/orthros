<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080c17">
<title>Orthros</title>
<link rel="icon" type="image/png" href="/src/host/web/orthros_logo.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; left: 0; right: 0; bottom: 0; top: var(--bar); display: flex; align-items: center; justify-content: center; }
  html:fullscreen #stage, body.nobar #stage, body.nobar #loader { top: 0; }
  #frame { position: relative; }
  #frame canvas { position: absolute; left: 0; top: 0; }
  #gl, #vid { pointer-events: none; }
  #vid { z-index: 3; visibility: hidden; }
  #softcursor { position: absolute; display: none; pointer-events: none; z-index: 5; image-rendering: pixelated; }
  #perfPanel { position: fixed; top: calc(var(--bar) + 6px); right: 150px; z-index: 41; background: rgba(14,15,20,.94); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 10px 12px; font: 12px/1.45 ui-monospace, monospace; color: #bfc3cc; white-space: pre; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #perfPanel canvas { display: block; margin-bottom: 6px; }
  html:fullscreen #perfPanel { display: none; }
  #log { position: absolute; left: 8px; bottom: 8px; right: 8px; max-height: 30%; overflow: auto; background: rgba(0,0,0,.7); font: 11px/1.3 ui-monospace, monospace; white-space: pre-wrap; display: none; padding: 6px; }
  #busy { position: absolute; left: 50%; bottom: 24px; border: 1px solid rgba(201,165,90,.25); transform: translateX(-50%); z-index: 25; background: rgba(0,0,0,.7); padding: 8px 14px; border-radius: 6px; font: 13px/1.5 system-ui, sans-serif; color: #ddd; text-align: center; pointer-events: none; }
  #busy small { font: 11px/1.5 ui-monospace, monospace; color: #999; }
  div#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; z-index: 20; text-align: center; }
  div#status .title { font-size: 18px; color: #eee; }
  div#status .detail { font: 12px/1.5 ui-monospace, monospace; color: #999; }
  div#status.error { pointer-events: auto; background: rgba(0,0,0,.85); }
  div#status.error .title { color: #f88; }
  div#status pre { max-width: 90vw; max-height: 50vh; overflow: auto; text-align: left; font: 11px/1.3 ui-monospace, monospace; color: #bbb; background: #111; padding: 8px; }
  div#status button { pointer-events: auto; margin-top: 6px; font: 14px system-ui, sans-serif; padding: 6px 18px; border-radius: 5px; border: 1px solid #666; background: #2a2a2a; color: #eee; cursor: pointer; }
  div#status button:hover { background: #3a3a3a; }
  .hidden { display: none !important; }
</style>
