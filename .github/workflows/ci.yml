# Orthros CI: the unit tests (Node) with the CRT-free Win32 test programs (clang, lld-link, llvm-dlltool) and the
# browser tests (Playwright Chromium). Not the CPU conformance against the native x86-32 oracle (`make gen`): its
# results are the reference CPU's, made on the development machine — a runner's CPU is another one (on GitHub's the
# oracle faults part way); those tests skip without them. No game files here: tests needing installed games skip.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Ubuntu's own archive instead of the runner's mirror list
        # (the runner's mirror, azure.archive.ubuntu.com, stopped resolving on 2026-11-11 for hours: every run failed
        # before its tests while installing Chromium's system packages)
        run: |
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g; s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$f"
          done
          grep -rhE '^(URIs|deb) ' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null | sort -u || true
      - name: Native tools (clang, lld, llvm 18)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 python3
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf /usr/bin/clang-18 "$RUNNER_TEMP/bin/clang"
          ln -sf /usr/bin/lld-link-18 "$RUNNER_TEMP/bin/lld-link"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Dependencies (Playwright and its Chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: make pe-tests test-unit
        run: make pe-tests test-unit
