name: Compatibility report
description: Report how far a game gets in Orthros (works great or breaks — both are data)
title: "[compat] <Game title> (<year>)"
labels: ["compat-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping preserve a game! Reports for commercial titles are welcome —
        just never attach game files. See [docs/contributing-with-ai.md](../../docs/contributing-with-ai.md).
  - type: input
    id: game
    attributes:
      label: Game and version
      description: Title, release year, and the copy's origin (GOG, retail CD, demo, …)
      placeholder: "Example Game (1999), GOG offline installer 2.1"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: How far does it get?
      options:
        - Completable — played through without blockers
        - In-game — gameplay works, with issues (note them below)
        - Menu — reaches the main menu, gameplay broken
        - Boots — process starts, no usable menu
        - Broken — crashes / hangs / exits before anything renders
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Bundle parameters
      description: The make-wgb flags / manifest settings that got it this far (resolution, bpp, RAM, OS, registry, skip-video)
      render: text
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: What works / what doesn't
      description: Video, audio, input, saves, cutscenes, performance — short bullets are perfect
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Harness report() snapshot (if it breaks)
      description: "Output of `bun tools/harness.ts report` at the point of failure — one structured POJO with registers, call stack, WinAPI ring, stubs, page faults"
      render: json
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Chrome 138 / Windows 11 / RTX 3060"
    validations:
      required: true
